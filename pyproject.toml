[project]
name = "mqtt-telemetry-hub"
version = "1.0.0"
description = "Self-hosted MQTT telemetry ingestion, storage, and live dashboard"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
