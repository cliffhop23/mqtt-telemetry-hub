services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  hub:
    build: .
    ports:
      - "8000:8000"
    environment:
      HUB_DB: /data/telemetry.db
      HUB_MQTT_HOST: mosquitto
      HUB_MQTT_PORT: "1883"
      HUB_MQTT_TOPIC: home/+/+
    volumes:
      - ./data:/data
    depends_on:
      - mosquitto
